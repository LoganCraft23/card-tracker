name: Probe TCG API

# Manual only. Reconnaissance for the sealed-product data source — runs where
# TCGAPI_KEY exists so the key never leaves GitHub. Safe to delete once
# scripts/sealed.js is written.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe endpoints and auth styles
        env:
          TCGAPI_KEY: ${{ secrets.TCGAPI_KEY }}
        run: node scripts/probe-tcgapi.js
