name: Sealed refresh
on: { workflow_dispatch: {} }
permissions:
  contents: write
jobs:
  sealed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - env:
          TCGAPI_KEY: ${{ secrets.TCGAPI_KEY }}
        run: node scripts/sealed.js
      - run: |
          git config user.name "foil-theory-bot"
          git config user.email "actions@github.com"
          git add history/sealed-prices.json docs/sealed.json
          git diff --cached --quiet || git commit -m "Sealed product snapshot"
          git push
