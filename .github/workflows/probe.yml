name: Finish collection pricing
on: { workflow_dispatch: {} }
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TCGAPI_KEY: ${{ secrets.TCGAPI_KEY }}
        run: node scripts/collection.js
      - run: |
          git config user.name "foil-theory-bot"
          git config user.email "actions@github.com"
          git add history/collection-prices.json history/collection-signals.json docs/collection.json
          git diff --cached --quiet || git commit -m "Finish pricing imported collection"
          git diff --cached --quiet || git push
