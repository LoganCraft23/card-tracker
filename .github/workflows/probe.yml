name: Probe 151
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - env:
          TCGAPI_KEY: ${{ secrets.TCGAPI_KEY }}
        run: node scripts/probe151.js
