name: Probe vintage collection pipeline
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Swap in a test collection.json (not committed)
        run: |
          cat > collection.json <<'JSON'
          {
            "note": "TEST FILE - not the real collection.json, only exists in this CI run",
            "cards": [
              { "vintageId": 33099, "vintageQuery": "Genesect EX", "qty": 1, "paid": 30, "note": "Genesect EX (Team Plasma), Plasma Blast" },
              { "vintageId": 30790, "vintageQuery": "Mew EX", "qty": 2, "paid": 70, "note": "Mew EX, Dragons Exalted" }
            ],
            "sealed": []
          }
          JSON
      - env:
          TCGAPI_KEY: ${{ secrets.TCGAPI_KEY }}
        run: node scripts/collection.js
      - name: Show what got written
        run: |
          echo "--- docs/collection.json ---"
          cat docs/collection.json
          echo "--- history/collection-prices.json ---"
          cat history/collection-prices.json
