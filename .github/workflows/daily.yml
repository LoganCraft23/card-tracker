name: Daily price update

on:
  schedule:
    - cron: "0 13 * * *" # 9:00 AM Eastern (13:00 UTC)
  workflow_dispatch: {} # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh screened watchlist (auto add/remove $5-$50 chases)
        run: node scripts/screen.js

      # Refits the value curve on the cross-section the screener just captured,
      # so the learned model updates every morning. Runs before update.js so
      # today's shadow predictions use today's coefficients.
      - name: Refit the value curve
        run: node scripts/fit.js

      - name: Fetch prices, compute signals
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # "on" pings for every signal change across the 200-card screened
          # watchlist, in addition to collection.json holdings. Flip to "off"
          # to go back to collection-only alerts.
          WATCHLIST_ALERTS: "on"
        run: node scripts/update.js

      # After update.js, so it can reuse that run's card prices for the
      # per-set chase read. Costs ~16 of the 100/day TCG API free tier.
      - name: Price sealed products
        env:
          TCGAPI_KEY: ${{ secrets.TCGAPI_KEY }}
        run: node scripts/sealed.js

      # After sealed, so owned sealed products can reuse that run's signals.
      # TCGAPI_KEY here is for cards with a vintageId in collection.json —
      # pricing for older prints TCGdex has no data for. Optional: a card
      # entry without vintageId never touches it.
      - name: Price your collection and alert on flips
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TCGAPI_KEY: ${{ secrets.TCGAPI_KEY }}
        run: node scripts/collection.js

      - name: Score past predictions against what actually happened
        run: node scripts/score.js

      - name: Commit updated history and dashboard data
        run: |
          git config user.name "foil-theory-bot"
          git config user.email "actions@github.com"
          git add history/ docs/data.json docs/sealed.json docs/collection.json docs/accuracy.json docs/model-fit.json watchlist.json
          git diff --cached --quiet || git commit -m "Daily price update $(date -u +%F)"
          git push
